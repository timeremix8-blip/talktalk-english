<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<!-- 보안 정책: 이 사이트의 파일만 실행하고, 외부로 데이터를 보내거나 다른 페이지를 끼워 넣지 못하게 막는다 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>톡톡 영어</title>
<style>
:root {
  --paper: #f3f6fb;
  --card: #ffffff;
  --ink: #1d2b4f;
  --muted: #5d6a88;
  --line: #d6deec;
  --sun: #ffc83d;
  --sun-ink: #3b2a00;
  --sky: #3a6df0;
  --sky-soft: #e3ebff;
  --good: #1f9d57;
  --good-soft: #dcf5e7;
  --bad: #d64545;
  --bad-soft: #fde4e4;
  --coach: #fff4d6;
  --fire: #ff7a1a;
  --font: system-ui, "SamsungOne", "Noto Sans KR", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.5; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---- 공통 ---- */
.page { min-height: 100%; padding: 20px 16px 32px; display: flex; flex-direction: column; gap: 18px; max-width: 520px; margin: 0 auto; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { font-weight: 800; font-size: 25px; letter-spacing: -0.5px; }
.logo span { background: var(--sun); color: var(--sun-ink); padding: 0 8px; border-radius: 8px; }
.badges { display: flex; gap: 6px; }
.pill { font-weight: 700; background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 3px 11px; white-space: nowrap; font-variant-numeric: tabular-nums; font-size: 15px; }
.back { color: var(--muted); font-size: 16px; padding: 6px 4px; }
h2 { font-size: 22px; margin: 0; font-weight: 800; }
h3 { font-size: 17px; margin: 0; font-weight: 800; }
.sub { color: var(--muted); margin: 2px 0 0; font-size: 15px; }
.note { color: var(--muted); font-size: 13px; text-align: center; margin: 0; }
.primary { background: var(--sky); color: #fff; border-radius: 14px; padding: 14px; font-size: 18px; font-weight: 700; width: 100%; }
.primary.sun { background: var(--sun); color: var(--sun-ink); }
.primary.ghost { background: var(--card); color: var(--sky); border: 2px solid var(--sky-soft); }

/* ---- 오늘의 학습 카드 ---- */
.today { background: var(--sky); color: #fff; border-radius: 22px; padding: 20px; display: grid; gap: 12px; }
.today .day { font-weight: 800; font-size: 14px; letter-spacing: 1px; opacity: .85; }
.today .name { font-size: 26px; font-weight: 800; line-height: 1.2; display: flex; gap: 10px; align-items: center; }
.today .name .ic { font-size: 34px; }
.today .desc { opacity: .9; font-size: 15px; }
.today .steps { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; }
.today .steps span { background: rgba(255,255,255,.18); border-radius: 999px; padding: 3px 10px; }
.today.done { background: var(--good); }

/* ---- 30일 지도 ---- */
.map { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 16px; display: grid; gap: 12px; }
.map-head { display: flex; justify-content: space-between; align-items: baseline; }
.grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.cell { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 15px; background: var(--paper); color: #9aa6c2; position: relative; }
.cell.done { background: var(--sun); color: var(--sun-ink); }
.cell.now { background: var(--card); color: var(--sky); box-shadow: inset 0 0 0 3px var(--sky); }
.cell .em { font-size: 20px; line-height: 1; }
.cell small { position: absolute; bottom: 2px; font-size: 10px; }
.bar { height: 10px; background: var(--paper); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sun); transition: width .3s; }

.menu { display: grid; gap: 10px; }
.tile { display: flex; align-items: center; gap: 14px; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 14px 16px; }
.tile:active { transform: scale(.98); }
.tile .ic { flex: none; width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; font-size: 25px; background: var(--sky-soft); }
.tile b { display: block; font-size: 18px; }
.tile small { color: var(--muted); font-size: 14px; }
.tile .right { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }
.tile.locked { opacity: .5; }

/* ---- 대화 화면 ---- */
.talk { height: 100%; display: flex; flex-direction: column; max-width: 520px; margin: 0 auto; }
.talk > .top { padding: 12px 16px; background: var(--paper); border-bottom: 1px solid var(--line); }
.talk .title { font-weight: 800; font-size: 16px; text-align: center; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { display: flex; gap: 8px; align-items: flex-start; max-width: 92%; }
.msg.me { align-self: flex-end; flex-direction: row-reverse; }
.face { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--sky); color: #fff; }
.face.coach { background: var(--sun); color: var(--sun-ink); font-size: 20px; }
.bubble { background: var(--card); border: 2px solid var(--line); border-radius: 4px 18px 18px 18px; padding: 10px 14px; min-width: 0; }
.msg.me .bubble { background: var(--sky); color: #fff; border-color: var(--sky); border-radius: 18px 4px 18px 18px; }
.msg.coach .bubble { background: var(--coach); border-color: #f3dfa3; }
.bubble .en { font-size: 20px; font-weight: 600; line-height: 1.35; }
.bubble .ko { color: var(--muted); font-size: 14px; margin-top: 4px; }
.bubble .ex { margin-top: 6px; padding: 8px 10px; background: var(--card); border-radius: 10px; }
.bubble .ex .en { font-size: 18px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip { background: var(--sky-soft); color: var(--sky); border-radius: 999px; padding: 5px 12px; font-size: 14px; font-weight: 700; }
.chip.sun { background: var(--sun); color: var(--sun-ink); }
.star-pop { align-self: center; color: var(--good); font-weight: 800; font-size: 15px; background: var(--good-soft); border-radius: 999px; padding: 4px 12px; }

.dock { background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px 14px; display: grid; gap: 8px; }
.live { text-align: center; color: var(--sky); font-weight: 600; min-height: 1.5em; font-size: 17px; }
.dock-row { display: flex; align-items: center; justify-content: space-around; }
.side { display: grid; justify-items: center; gap: 2px; font-size: 24px; width: 76px; color: var(--muted); }
.side span { font-size: 13px; font-weight: 700; }
.mic { width: 78px; height: 78px; border-radius: 50%; background: var(--sky); display: grid; place-items: center; box-shadow: 0 4px 14px rgba(58,109,240,.35); }
.mic svg { width: 36px; height: 36px; fill: #fff; }
.mic.on { background: var(--bad); animation: pulse 1.2s infinite; }
.mic.wait { background: var(--muted); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(214,69,69,.5); } 100% { box-shadow: 0 0 0 22px rgba(214,69,69,0); } }
.mic-label { text-align: center; color: var(--muted); font-size: 14px; margin: 0; }
.type-form { display: flex; gap: 8px; }
.type-form input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink); }
.type-form button { background: var(--sky); color: #fff; border-radius: 12px; padding: 0 16px; font-weight: 700; }

/* ---- 따라 말하기 ---- */
.card { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 22px 18px; display: grid; gap: 10px; text-align: center; }
.card .en { font-size: 26px; font-weight: 700; line-height: 1.3; }
.card .ko { color: var(--muted); }
.step-tag { display: inline-block; background: var(--sun); color: var(--sun-ink); font-weight: 800; font-size: 13px; border-radius: 999px; padding: 2px 10px; }
.words { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.w { padding: 3px 10px; border-radius: 8px; font-weight: 700; font-size: 18px; }
.w.ok { background: var(--good-soft); color: var(--good); }
.w.miss { background: var(--bad-soft); color: var(--bad); }
.score { font-size: 44px; font-weight: 800; line-height: 1; }
.center-mic { display: grid; justify-items: center; gap: 8px; }
.row2 { display: flex; gap: 8px; }
.row2 > * { flex: 1; }

/* ---- 결과 / 도장 ---- */
.result { text-align: center; background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 24px 18px; display: grid; gap: 10px; }
.result .big { font-size: 52px; font-weight: 800; line-height: 1; }
.stamp { width: 120px; height: 120px; margin: 4px auto; border-radius: 50%; border: 5px solid var(--bad); color: var(--bad); display: grid; place-items: center; font-weight: 900; font-size: 20px; line-height: 1.1; transform: rotate(-12deg); animation: stamp .45s ease-out; }
@keyframes stamp { 0% { transform: rotate(-12deg) scale(2.2); opacity: 0; } 100% { transform: rotate(-12deg) scale(1); opacity: 1; } }
.fire { color: var(--fire); font-weight: 800; }
.learned { text-align: left; display: grid; gap: 6px; }
.learned div { background: var(--paper); border-radius: 10px; padding: 8px 12px; }
.learned small { color: var(--muted); display: block; }

/* ---- 설정 ---- */
.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.opt { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 12px; font-weight: 700; }
.opt.on { border-color: var(--sky); background: var(--sky-soft); color: var(--sky); }

@media (prefers-reduced-motion: reduce) { .mic.on, .stamp { animation: none; } }
</style>
</head>
<body>
<div id="app" style="height:100%"></div>

<script src="lessons.js"></script>
<script>
// ---- 대본 데이터 정리 ----
LESSONS.forEach((l, i) => {
  l.day = i + 1;
  l.turns = l.turns.map(([bot, ko, ok, ex, exKo]) => ({ bot, ko, ok: ok.split("|"), ex, exKo }));
  l.key = l.turns.slice(0, 3).map(t => [t.ex, t.exKo]);  // 오늘의 표현 3개
});
const PRAISE = ["Great!", "Nice!", "Awesome!", "Cool!", "Good job!", "Wonderful!", "I see!"];

// =====================================================================
// 저장 (이 폰에만 저장)
//  stars: 모은 별 / done: { 과 번호: 끝낸 날짜 } / days: 공부한 날짜 목록
// =====================================================================
// 앱에서는 기록을 앱 저장소(Android.saveData)에, 브라우저에서는 localStorage 에 보관
const hasNativeStore = () => { try { return !!(window.Android && Android.loadData); } catch (e) { return false; } };
let saved = {};
try { if (hasNativeStore()) saved = JSON.parse(Android.loadData() || "{}"); } catch (e) {}
if (!Object.keys(saved).length) { try { saved = JSON.parse(localStorage.getItem("talktalk") || "{}"); } catch (e) {} }
saved.stars = saved.stars || 0;
saved.done = saved.done || {};
saved.days = saved.days || [];
function save() {
  const json = JSON.stringify(saved);
  try { if (hasNativeStore()) Android.saveData(json); } catch (e) {}
  try { localStorage.setItem("talktalk", json); } catch (e) {}
}

const pad = n => String(n).padStart(2, "0");
const dateStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => dateStr(new Date());
const doneCount = () => Object.keys(saved.done).length;
const studiedToday = () => saved.days.includes(todayStr());
function streak() {
  const set = new Set(saved.days);
  const d = new Date();
  if (!set.has(dateStr(d))) d.setDate(d.getDate() - 1);   // 오늘 아직 안 했으면 어제부터 셈
  let n = 0;
  while (set.has(dateStr(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function completeLesson(idx) {
  const first = !(idx in saved.done);
  if (first) saved.done[idx] = todayStr();
  if (!studiedToday()) saved.days.push(todayStr());
  save();
  try { window.Android && Android.markStudied && Android.markStudied(); } catch (e) {}
  return first;
}

// =====================================================================
// 음성: 앱 안에서는 안드로이드 기능, PC 브라우저에서는 웹 기능 사용
// =====================================================================
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let webRec = null;
const Voice = {
  speak(text) {
    try {
      if (window.Android) return Android.speak(text);
      if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "en-US"; u.rate = 0.85;
        speechSynthesis.speak(u);
      }
    } catch (e) {}
  },
  stop() {
    try { if (window.Android) Android.stopSpeak(); else if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch (e) {}
  },
  canListen() {
    try { return window.Android ? Android.canListen() : !!SR; } catch (e) { return false; }
  },
  listen() {
    if (window.Android) return Android.listen();
    if (!SR) return onSpeechError(-1);
    Voice.stop();
    webRec = new SR();
    webRec.lang = "en-US"; webRec.interimResults = true; webRec.maxAlternatives = 5;
    webRec.onstart = () => onListenState("listening");
    webRec.onresult = e => {
      const r = e.results[e.results.length - 1];
      if (r.isFinal) onSpeechResult(Array.from(r).map(a => a.transcript));
      else onSpeechPartial(r[0].transcript);
    };
    webRec.onerror = e => onSpeechError(e.error === "no-speech" ? 6 : e.error === "not-allowed" ? 9 : 7);
    webRec.start();
  },
  stopListen() {
    try { if (window.Android) Android.stopListen(); else if (webRec) webRec.stop(); } catch (e) {}
  },
};

let onHeard = null;   // 지금 화면에서 음성 결과를 받을 함수
let listening = false;
const IDLE_LABEL = "버튼을 누르고 영어로 말해요";

window.onSpeakDone = () => {};
window.onListenState = state => {
  const mic = document.getElementById("mic"), label = document.getElementById("micLabel");
  if (!mic) return;
  mic.classList.toggle("on", state === "listening");
  mic.classList.toggle("wait", state === "processing");
  if (label) label.textContent = state === "listening" ? "듣고 있어요… 영어로 말해 보세요" : "알아듣는 중…";
};
window.onSpeechPartial = text => {
  const live = document.getElementById("live");
  if (live) live.textContent = text;
};
window.onSpeechResult = list => {
  resetMic();
  if (!list || !list.length) return onSpeechError(7);
  if (onHeard) onHeard(list);
};
window.onSpeechError = code => {
  resetMic();
  const msg = {
    6: "아무 말도 안 들렸어요. 버튼을 누르고 조금 더 크게 말해 주세요.",
    7: "잘 못 알아들었어요. 다시 한번 또박또박 말해 볼까요?",
    5: "마이크 버튼을 다시 눌러 주세요.",
    9: "마이크 권한이 필요해요. 휴대폰 설정 → 애플리케이션 → 톡톡 영어 → 권한에서 마이크를 허용해 주세요.",
    "-1": "이 기기에서는 음성 인식을 쓸 수 없어요. ⌨️ 글쓰기로 대답해 주세요.",
  }[code] || "음성 인식에 문제가 생겼어요. 잠시 후 다시 눌러 주세요.";
  const label = document.getElementById("micLabel");
  if (label) label.textContent = msg;
};
function resetMic() {
  listening = false;
  const mic = document.getElementById("mic"), live = document.getElementById("live"), label = document.getElementById("micLabel");
  if (mic) mic.classList.remove("on", "wait");
  if (live) live.textContent = "";
  if (label) label.textContent = IDLE_LABEL;
}
function toggleMic() {
  if (listening) { Voice.stopListen(); return; }
  listening = true;
  onListenState("listening");
  Voice.listen();
}
function stopAll() { Voice.stop(); Voice.stopListen(); resetMic(); onHeard = null; }

// =====================================================================
// 도우미
// =====================================================================
const app = document.getElementById("app");
let screen = "home";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = s => " " + s.toLowerCase().replace(/[’`]/g, "'").replace(/[^a-z0-9' ]+/g, " ").replace(/\s+/g, " ").trim() + " ";
// 정답 판정: 정답 목록의 말이 대답에 들어 있으면 OK. 4글자 이상 한 단어는 swim → swimming 처럼 변형도 인정
const matches = (said, okList) => {
  const n = norm(said), words = n.trim().split(" ");
  return okList.some(p => {
    const q = norm(p);
    if (n.includes(q)) return true;
    const w = q.trim();
    return w.length >= 4 && !w.includes(" ") && words.some(x => x.startsWith(w));
  });
};
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => arr.map(x => [Math.random(), x]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
const MIC_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>';

const badges = () => `<div class="badges"><div class="pill fire">🔥 ${streak()}</div><div class="pill" id="stars">⭐ ${saved.stars}</div></div>`;
function addStars(n) {
  saved.stars += n; save();
  const el = document.getElementById("stars");
  if (el) el.textContent = "⭐ " + saved.stars;
}

window.handleBack = () => {
  stopAll();
  if (screen === "home") return false;
  home();
  return true;
};

// =====================================================================
// 처음 화면: 오늘의 학습 + 30일 지도
// =====================================================================
function home() {
  screen = "home"; stopAll();
  const n = doneCount(), next = LESSONS[n], doneToday = studiedToday();
  let todayCard;
  if (n >= LESSONS.length) {
    todayCard = `<div class="today done"><div class="day">COMPLETE</div>
      <div class="name"><span class="ic">🏆</span>30일 코스 완주!</div>
      <div class="desc">정말 대단해요! 이제 복습으로 매일 연습해요.</div>
      <button class="primary sun" id="todayBtn">랜덤 복습 대화하기</button></div>`;
  } else if (doneToday) {
    todayCard = `<div class="today done"><div class="day">DAY ${n} 완료 ✓</div>
      <div class="name"><span class="ic">✅</span>오늘 공부 끝!</div>
      <div class="desc">내일은 <b>Day ${next.day} · ${next.name}</b> 수업이 열려요.</div>
      <button class="primary sun" id="todayBtn">오늘 배운 거 한 번 더</button></div>`;
  } else {
    todayCard = `<div class="today"><div class="day">TODAY · DAY ${next.day}</div>
      <div class="name"><span class="ic">${next.icon}</span>${next.name}</div>
      <div class="desc">${next.desc}</div>
      <div class="steps"><span>① 오늘의 표현 3개</span><span>② 토비와 대화</span><span>③ 도장 받기</span></div>
      <button class="primary sun" id="todayBtn">오늘의 학습 시작</button></div>`;
  }

  app.innerHTML = `<div class="page">
    <div class="top"><div class="logo">톡톡 <span>English</span></div>${badges()}</div>
    ${todayCard}
    <div class="map">
      <div class="map-head"><h3>30일 학습 지도</h3><span class="sub">${n} / ${LESSONS.length}</span></div>
      <div class="bar"><i style="width:${n / LESSONS.length * 100}%"></i></div>
      <div class="grid">${LESSONS.map((l, i) => {
        const cls = i in saved.done ? "done" : (i === n && !doneToday ? "now" : "");
        const inner = i in saved.done ? `<span class="em">${l.icon}</span><small>${l.day}</small>` : l.day;
        return `<button class="cell ${cls}" data-day="${i}" aria-label="Day ${l.day} ${l.name}">${inner}</button>`;
      }).join("")}</div>
      <p class="note">끝낸 날을 누르면 그 수업을 복습할 수 있어요</p>
    </div>
    <div class="menu">
      <button class="tile" id="goReview"><span class="ic">🔁</span><span><b>복습하기</b><small>지금까지 배운 대화 다시 하기</small></span><span class="right">${n}개</span></button>
      <button class="tile" id="goRepeat"><span class="ic">🎤</span><span><b>따라 말하기</b><small>배운 표현 발음 연습</small></span></button>
      ${window.Android && Android.setReminder ? `<button class="tile" id="goAlarm"><span class="ic">⏰</span><span><b>매일 알림</b><small>${reminderText()}</small></span></button>` : ""}
    </div>
    ${Voice.canListen() ? "" : `<p class="note">음성 인식을 찾지 못했어요. 글로 대답할 수 있어요. (Google 앱이 있으면 음성 인식이 돼요)</p>`}
    <p class="note">내용 버전 ${esc(typeof CONTENT_VERSION === "undefined" ? "-" : CONTENT_VERSION)}${location.protocol === "file:" ? " · 오프라인 기본 내용" : ""}</p>
  </div>`;

  document.getElementById("todayBtn").onclick = () => {
    if (n >= LESSONS.length) talkScreen(pick(LESSONS), { review: true });
    else if (doneToday) lessonFlow(n - 1, true);
    else lessonFlow(n, false);
  };
  app.querySelectorAll("[data-day]").forEach(b => b.onclick = () => {
    const i = +b.dataset.day;
    if (i in saved.done) lessonFlow(i, true);
    else if (i === n && !doneToday) lessonFlow(i, false);
    else toast(i === n ? "내일 열려요! 오늘은 이미 공부를 마쳤어요." : `Day ${i + 1}은 아직 잠겨 있어요. 하루에 한 과씩 열려요.`);
  });
  document.getElementById("goReview").onclick = reviewList;
  document.getElementById("goRepeat").onclick = () => {
    const pool = LESSONS.filter((l, i) => i in saved.done).flatMap(l => l.turns.map(t => [t.ex, t.exKo]));
    const list = shuffle(pool.length >= 5 ? pool : LESSONS[0].turns.map(t => [t.ex, t.exKo])).slice(0, 8);
    screen = "repeat";
    repeatSession(list, "따라 말하기", avg => repeatResult(avg));
  };
  const alarm = document.getElementById("goAlarm");
  if (alarm) alarm.onclick = alarmScreen;
}

function toast(msg) {
  const t = document.createElement("div");
  t.textContent = msg;
  t.style.cssText = "position:fixed;left:16px;right:16px;bottom:24px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;text-align:center;font-size:15px;z-index:9";
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

function reviewList() {
  screen = "review"; stopAll();
  const list = LESSONS.filter((l, i) => i in saved.done);
  app.innerHTML = `<div class="page">
    <div class="top"><button class="back" id="back">‹ 처음으로</button>${badges()}</div>
    <div><h2>복습하기</h2><p class="sub">지금까지 배운 대화를 다시 해 봐요. 복습으로도 별을 모을 수 있어요.</p></div>
    <div class="menu">${list.length ? list.map(l => `
      <button class="tile" data-i="${l.day - 1}"><span class="ic">${l.icon}</span>
      <span><b>${l.name}</b><small>Day ${l.day} · ${l.desc}</small></span></button>`).join("")
      : `<p class="note">아직 끝낸 수업이 없어요. 오늘의 학습부터 시작해요!</p>`}
    </div></div>`;
  document.getElementById("back").onclick = home;
  app.querySelectorAll("[data-i]").forEach(b => b.onclick = () => talkScreen(LESSONS[+b.dataset.i], { review: true }));
}

// =====================================================================
// 하루 학습: ① 오늘의 표현 → ② 대화 → ③ 도장
// =====================================================================
function lessonFlow(idx, isReview) {
  const lesson = LESSONS[idx];
  screen = "lesson";
  // ① 오늘의 표현
  app.innerHTML = `<div class="page">
    <div class="top"><button class="back" id="back">‹ 처음으로</button>${badges()}</div>
    <div class="card" style="text-align:left">
      <span class="step-tag" style="justify-self:start">DAY ${lesson.day} · ① 오늘의 표현</span>
      <div style="font-size:24px;font-weight:800">${lesson.icon} ${lesson.name}</div>
      <div class="sub">오늘 대화에서 쓸 표현 3개를 먼저 듣고 따라 말해 봐요.</div>
      <div class="learned">${lesson.key.map(([en, ko]) => `<div><b>${esc(en)}</b><small>${esc(ko)}</small></div>`).join("")}</div>
    </div>
    <button class="primary sun" id="startKey">표현 연습 시작</button>
    <button class="primary ghost" id="skipKey">바로 대화하기</button>
  </div>`;
  document.getElementById("back").onclick = home;
  document.getElementById("startKey").onclick = () =>
    repeatSession(lesson.key, `Day ${lesson.day} · ① 오늘의 표현`, () => talkStep());
  document.getElementById("skipKey").onclick = talkStep;

  // ② 대화
  function talkStep() {
    talkScreen(lesson, { review: isReview, onDone: score => stampStep(score) });
  }
  // ③ 도장
  function stampStep(score) {
    const first = isReview ? false : completeLesson(idx);
    if (first) addStars(3);
    const s = streak();
    const nextL = LESSONS[idx + 1];
    screen = "done";
    app.innerHTML = `<div class="page">
      <div class="top"><span></span>${badges()}</div>
      <div class="result">
        <span class="step-tag" style="justify-self:center">DAY ${lesson.day} · ③ 완료</span>
        <div class="stamp">참<br>잘했어요</div>
        <h2>${lesson.name} 끝!</h2>
        <div>대화 점수 <b>⭐ ${score} / ${lesson.turns.length}</b>${first ? " · 완료 보너스 ⭐ +3" : ""}</div>
        ${!isReview ? `<div class="fire" style="font-size:20px">🔥 ${s}일 연속 공부 중!</div>` : ""}
        ${!isReview && nextL ? `<div class="sub">내일은 <b>Day ${nextL.day} · ${nextL.icon} ${nextL.name}</b> 수업이 열려요.</div>` : ""}
        ${!isReview && !nextL ? `<div class="sub">🏆 30일 코스를 모두 마쳤어요!</div>` : ""}
      </div>
      <div class="learned"><b>오늘 배운 표현</b>${lesson.turns.map(t => `<div>${esc(t.ex)}<small>${esc(t.exKo)}</small></div>`).join("")}</div>
      <button class="primary" id="homeBtn">처음으로</button>
    </div>`;
    document.getElementById("homeBtn").onclick = home;
    Voice.speak(isReview ? "Great job!" : "Great job today! See you tomorrow!");
  }
}

// =====================================================================
// 토비와 대화하기 (opts.onDone(score) 가 있으면 끝나고 호출)
// =====================================================================
function talkScreen(lesson, opts) {
  opts = opts || {};
  screen = "talk";
  let t = 0, tries = 0, score = 0;

  app.innerHTML = `<div class="talk">
    <div class="top"><button class="back" id="back">‹ 나가기</button><div class="title">${lesson.icon} Day ${lesson.day} · ${lesson.name}</div><div class="pill" id="stars">⭐ ${saved.stars}</div></div>
    <div class="chat" id="chat"></div>
    <div class="dock" id="dock">
      <div class="live" id="live"></div>
      <div class="dock-row">
        <button class="side" id="hintBtn">💡<span>힌트</span></button>
        <button class="mic" id="mic" aria-label="말하기">${MIC_SVG}</button>
        <button class="side" id="kbBtn">⌨️<span>글쓰기</span></button>
      </div>
      <form class="type-form" id="typeForm" hidden><input id="typeIn" autocomplete="off" placeholder="영어로 대답을 써요"><button>보내기</button></form>
      <p class="mic-label" id="micLabel">${IDLE_LABEL}</p>
    </div></div>`;

  const chat = document.getElementById("chat");
  const scroll = () => setTimeout(() => chat.scrollTop = chat.scrollHeight, 30);
  const add = (cls, html) => { const el = document.createElement("div"); el.className = cls; el.innerHTML = html; chat.appendChild(el); scroll(); return el; };

  function addBot(en, ko) {
    const el = add("msg", `<div class="face">T</div><div class="bubble">
      <div class="en">${esc(en)}</div><div class="ko" hidden>${esc(ko)}</div>
      <div class="chips"><button class="chip" data-a="play">🔊 다시 듣기</button><button class="chip" data-a="ko">뜻 보기</button></div></div>`);
    el.querySelector('[data-a="play"]').onclick = () => Voice.speak(en);
    el.querySelector('[data-a="ko"]').onclick = e => { el.querySelector(".ko").hidden = false; e.target.remove(); };
  }
  function addCoach(html, withSkip) {
    const el = add("msg coach", `<div class="face coach">💡</div><div class="bubble">${html}
      ${withSkip ? `<div class="chips"><button class="chip sun" data-a="skip">다음 질문으로 ›</button></div>` : ""}</div>`);
    el.querySelectorAll('[data-a="say"]').forEach(b => b.onclick = () => Voice.speak(b.dataset.t));
    const skip = el.querySelector('[data-a="skip"]');
    if (skip) skip.onclick = () => { skip.remove(); next(""); };
  }
  const exampleHtml = turn => `<div class="ex"><div class="en">${esc(turn.ex)}</div><div class="ko">${esc(turn.exKo)}</div>
      <div class="chips"><button class="chip" data-a="say" data-t="${esc(turn.ex)}">🔊 들어 보기</button></div></div>`;

  function ask(prefix) {
    const turn = lesson.turns[t];
    const en = prefix ? prefix + " " + turn.bot : turn.bot;
    tries = 0;
    addBot(en, turn.ko);
    Voice.speak(en);
  }
  function next(prefix) {
    t++;
    if (t < lesson.turns.length) setTimeout(() => ask(prefix), 600);
    else setTimeout(finish, 600);
  }
  onHeard = list => {
    const turn = lesson.turns[t];
    if (!turn) return;
    add("msg me", `<div class="bubble"><div class="en">${esc(list[0])}</div></div>`);
    if (list.some(s => matches(s, turn.ok))) {
      score++; addStars(1);
      add("star-pop", "⭐ +1 잘했어요!");
      next(pick(PRAISE));
    } else {
      tries++;
      if (tries === 1) addCoach(`음… 질문과 조금 다른 대답 같아요.<br>다시 말해 볼까요? 어려우면 <b>💡 힌트</b>를 눌러요.`);
      else { addCoach(`이렇게 말해 볼 수 있어요. 듣고 따라 말해 봐요!${exampleHtml(turn)}`, true); Voice.speak(turn.ex); }
    }
  };

  function finish() {
    onHeard = null;
    document.getElementById("dock").hidden = true;
    if (opts.onDone) {
      const el = add("result", `<h2>대화 끝! ⭐ ${score} / ${lesson.turns.length}</h2><button class="primary sun" id="toStamp">도장 받으러 가기 ›</button>`);
      el.querySelector("#toStamp").onclick = () => opts.onDone(score);
      Voice.speak("Good job! You finished the talk!");
      return;
    }
    const el = add("result", `<h2>복습 끝! ⭐ ${score} / ${lesson.turns.length}</h2>
      <div class="learned">${lesson.turns.map(x => `<div>${esc(x.ex)}<small>${esc(x.exKo)}</small></div>`).join("")}</div>
      <button class="primary sun" id="again">다시 대화하기</button><button class="primary" id="homeBtn">처음으로</button>`);
    el.querySelector("#again").onclick = () => talkScreen(lesson, opts);
    el.querySelector("#homeBtn").onclick = home;
    Voice.speak("Good job! See you next time!");
  }

  document.getElementById("back").onclick = home;
  document.getElementById("mic").onclick = toggleMic;
  document.getElementById("hintBtn").onclick = () => {
    const turn = lesson.turns[t];
    if (!turn) return;
    addCoach(`이렇게 대답할 수 있어요.${exampleHtml(turn)}`);
    Voice.speak(turn.ex);
  };
  const form = document.getElementById("typeForm"), input = document.getElementById("typeIn");
  document.getElementById("kbBtn").onclick = () => { form.hidden = !form.hidden; if (!form.hidden) input.focus(); };
  form.onsubmit = e => {
    e.preventDefault();
    const v = input.value.trim();
    if (!v) return;
    input.value = "";
    if (onHeard) onHeard([v]);
  };

  setTimeout(() => ask(""), 300);
}

// =====================================================================
// 따라 말하기 (list: [[영어, 뜻], ...], 끝나면 onFinish(평균 점수))
// =====================================================================
function repeatSession(list, title, onFinish) {
  let i = 0, total = 0;

  function show() {
    const [en, ko] = list[i];
    app.innerHTML = `<div class="page">
      <div class="top"><button class="back" id="back">‹ 처음으로</button>${badges()}</div>
      <div style="display:grid;gap:8px"><div style="display:flex;justify-content:space-between;gap:8px"><h3>${esc(title)}</h3><span class="sub">${i + 1} / ${list.length}</span></div>
      <div class="bar" style="background:var(--line)"><i style="width:${i / list.length * 100}%"></i></div></div>
      <div class="card"><div class="en">${esc(en)}</div><div class="ko">${esc(ko)}</div>
        <div class="chips" style="justify-content:center"><button class="chip" id="play">🔊 듣기</button><button class="chip" id="slow">🐢 천천히</button><button class="chip" id="skip">건너뛰기 ›</button></div></div>
      <div id="res"></div>
      <div class="center-mic">
        <div class="live" id="live"></div>
        <button class="mic" id="mic" aria-label="말하기">${MIC_SVG}</button>
        <p class="mic-label" id="micLabel">버튼을 누르고 따라 말해요</p>
      </div></div>`;
    document.getElementById("back").onclick = home;
    document.getElementById("play").onclick = () => Voice.speak(en);
    document.getElementById("slow").onclick = () => Voice.speak(en.replace(/ /g, ", "));
    document.getElementById("skip").onclick = () => advance(0, 0);
    document.getElementById("mic").onclick = toggleMic;
    Voice.speak(en);

    onHeard = alts => {
      const target = norm(en).trim().split(" ");
      let best = { pct: -1 };
      alts.forEach(a => {
        const pool = norm(a).trim().split(" ");
        const marks = target.map(w => { const k = pool.indexOf(w); if (k >= 0) { pool.splice(k, 1); return true; } return false; });
        const pct = Math.round(marks.filter(Boolean).length / target.length * 100);
        if (pct > best.pct) best = { pct, marks, said: a };
      });
      const words = en.replace(/[.,!?]/g, "").split(/\s+/);
      const stars = best.pct >= 90 ? 3 : best.pct >= 60 ? 2 : best.pct >= 30 ? 1 : 0;
      const msg = stars === 3 ? "Excellent! 아주 정확해요!" : stars === 2 ? "Good! 거의 다 맞았어요!" : stars === 1 ? "Nice try! 빨간 단어를 연습해 봐요" : "다시 한번 해 볼까요?";
      document.getElementById("res").innerHTML = `<div class="card">
        <div class="score">${best.pct}<span style="font-size:20px">점</span></div>
        <div>${"⭐".repeat(stars)}${"☆".repeat(3 - stars)} ${msg}</div>
        <div class="words">${words.map((w, k) => `<span class="w ${best.marks[k] ? "ok" : "miss"}">${esc(w)}</span>`).join("")}</div>
        <div class="ko">내가 말한 것: "${esc(best.said)}"</div>
        <div class="row2"><button class="primary sun" id="retry">다시 하기</button><button class="primary" id="nextBtn">${i + 1 < list.length ? "다음 ›" : "완료 ›"}</button></div>
      </div>`;
      document.getElementById("retry").onclick = () => { document.getElementById("res").innerHTML = ""; Voice.speak(en); };
      document.getElementById("nextBtn").onclick = () => advance(best.pct, stars);
    };
  }

  function advance(pct, stars) {
    total += pct;
    if (stars) addStars(stars);
    i++;
    if (i < list.length) show();
    else { stopAll(); onFinish(Math.round(total / list.length)); }
  }

  show();
}

function repeatResult(avg) {
  screen = "repeat";
  app.innerHTML = `<div class="page">
    <div class="top"><button class="back" id="back">‹ 처음으로</button>${badges()}</div>
    <div class="result"><div class="sub">따라 말하기 평균 점수</div><div class="big">${avg}<span style="font-size:24px">점</span></div>
    <h2>${avg >= 80 ? "Excellent! 발음이 정말 좋아요!" : avg >= 50 ? "Good job! 잘하고 있어요!" : "Keep going! 매일 하면 늘어요!"}</h2></div>
    <button class="primary" id="homeBtn">처음으로</button></div>`;
  document.getElementById("back").onclick = home;
  document.getElementById("homeBtn").onclick = home;
}

// =====================================================================
// 매일 알림 설정 (앱에서만)
// =====================================================================
const ALARM_OPTS = [[-1, "끄기"], [16, "오후 4시"], [17, "오후 5시"], [18, "오후 6시"], [19, "오후 7시"], [20, "오후 8시"]];
function reminderText() {
  let h = -1;
  try { h = Android.getReminder(); } catch (e) {}
  const o = ALARM_OPTS.find(x => x[0] === h);
  return h < 0 ? "꺼져 있어요 · 눌러서 켜기" : `매일 ${o ? o[1] : h + "시"}에 알려 줘요`;
}
function alarmScreen() {
  screen = "alarm";
  let h = -1;
  try { h = Android.getReminder(); } catch (e) {}
  app.innerHTML = `<div class="page">
    <div class="top"><button class="back" id="back">‹ 처음으로</button>${badges()}</div>
    <div><h2>⏰ 매일 알림</h2><p class="sub">정한 시간에 "오늘의 영어 할 시간!" 알림을 보내요. 그날 이미 공부했으면 알림이 오지 않아요.</p></div>
    <div class="opts">${ALARM_OPTS.map(([v, label]) => `<button class="opt ${v === h ? "on" : ""}" data-h="${v}">${label}</button>`).join("")}</div>
  </div>`;
  document.getElementById("back").onclick = home;
  app.querySelectorAll("[data-h]").forEach(b => b.onclick = () => {
    try { Android.setReminder(+b.dataset.h); } catch (e) {}
    toast(+b.dataset.h < 0 ? "알림을 껐어요." : `매일 ${b.textContent}에 알려 줄게요!`);
    alarmScreen();
  });
}

home();
</script>
